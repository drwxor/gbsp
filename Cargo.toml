[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
bytemuck = { version = "1", features = ["derive", "extern_crate_alloc"] }
rayon = "1"
gold-common = { path = "crates/gold-common" }
gold-bsp = { path = "crates/gold-bsp" }
gold-vis = { path = "crates/gold-vis" }
gold-rad = { path = "crates/gold-rad" }

[package]
name = "gbsp"
version.workspace = true
edition.workspace = true
description = "Gold engine map compiler suite: VMF to BSP (gbsp), visibility (gvis), lighting (grad)"

[[bin]]
name = "gbsp"
path = "src/bin/gbsp.rs"

[[bin]]
name = "gvis"
path = "src/bin/gvis.rs"

[[bin]]
name = "grad"
path = "src/bin/grad.rs"

[dependencies]
gold-bsp.workspace = true
gold-vis.workspace = true
gold-rad.workspace = true

[profile.release]
debug = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
gold-common.workspace = true
